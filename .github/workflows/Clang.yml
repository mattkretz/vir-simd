name: Clang CI

on:
  push:
    branches: [ master, main ]
    paths:
      - '**.h'
      - '**.cpp'
      - '**.cc'
      - '**.sh'
      - '**Makefile'
      - '**CMakeLists.txt'
      - '.github/workflows/Clang.yml'
  pull_request:

env:
  CXX: clang++

jobs:
  clang:
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17, 20]

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mattkretz/cplusplus-ci/clang${{ matrix.version}}

    steps:
      - uses: actions/checkout@v4
        with:
          path: vir-simd

      - name: Cache test data
        id: cache-testdata
        uses: actions/cache@v4
        with:
          path: vc-testdata
          key: testdata-1
          enableCrossOsArchive: true

      - name: Download test data
        if: steps.cache-testdata.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: VcDevel/vc-testdata
          path: vc-testdata

      - name: Run test suite
        # Pinned below AVX-512 on purpose. libstdc++'s <experimental/simd> does
        # not compile under Clang for the AVX-512 mask ABIs: _S_to_bits asserts
        # is_same_v<_Tp, __int_for_sizeof_t<_Tp>>, and for _Tp = long long that
        # is false there, so simd<double, _VecBltnBtmsk<N>>::operator== fails to
        # instantiate. The testsuite otherwise builds with -march=native, so
        # this job started failing when the runner fleet moved to AVX-512
        # capable hardware, with nothing in this repository having changed.
        # GCC compiles the same code, and keeps -march=native.
        run: cd vir-simd && make check DRIVEROPTS=-vvf testflags=-march=x86-64-v3

  clang-libcxx:
    strategy:
      fail-fast: false
      matrix:
        version: [14, 15, 17, 20]

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mattkretz/cplusplus-ci/clang${{ matrix.version}}

    env:
      CXXFLAGS: -stdlib=libc++

    steps:
      - uses: actions/checkout@v4
        with:
          path: vir-simd

      - name: Cache test data
        id: cache-testdata
        uses: actions/cache@v4
        with:
          path: vc-testdata
          key: testdata-1
          enableCrossOsArchive: true

      - name: Download test data
        if: steps.cache-testdata.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: VcDevel/vc-testdata
          path: vc-testdata

      - name: CMake test
        run: |
          cmake -S vir-simd -B cmake-build -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build cmake-build --target check

      - name: Run test suite
        run: cd vir-simd && make check DRIVEROPTS=-vvf
